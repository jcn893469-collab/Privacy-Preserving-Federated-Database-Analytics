spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fpa_db
    username: ${DB_USERNAME:fpa_user}
    password: ${DB_PASSWORD:FPA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.fpa: DEBUG